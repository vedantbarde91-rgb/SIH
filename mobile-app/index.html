<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- MOBILE-OPTIMIZED VIEWPORT: user-scalable=no for app-like feel, viewport-fit=cover for notch/status bar -->

    <title>NER-LEWS | Landslide Early Warning</title>
    <meta name="description" content="AI-Based Landslide Early Warning and Risk Monitoring System for North Eastern Region (NER) of India" />

    <!-- PWA / Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- PWA Manifest -->

    <!-- Prevent iOS text size adjust -->

      html { -webkit-text-size-adjust: 100%; }
      /* Prevent pull-to-refresh on Android Chrome */
      body { overscroll-behavior-y: contain; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">
